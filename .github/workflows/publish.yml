# Publishes to npm when a GitHub release is published, through trusted
# publishing (OIDC): no npm token is stored, and npm attaches provenance.
# A trusted publisher can only be added to an existing package, so the first
# version is published by hand.
name: Publish to npm

on:
    release:
        types: [published]

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            # Trusted publishing needs npm 11.5.1 or later, which not every
            # Node 24 release bundles.
            - run: npm install -g npm@^11.5.1

            - run: corepack enable

            - run: corepack pnpm install --frozen-lockfile

            # Stop if the tag and package.json disagree. Skip, not fail, a
            # version already on npm (1.0.0 goes out by hand): npm never
            # accepts a version twice.
            - name: Check the version
              id: version
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  version=$(node -p "require('./package.json').version")
                  if [ "$TAG" != "v$version" ]; then
                      echo "::error::Release tag $TAG does not match package.json version $version (expected v$version)"
                      exit 1
                  fi
                  if npm view "maplibre-gl-lanes@$version" version >/dev/null 2>&1; then
                      echo "::notice::maplibre-gl-lanes@$version is already on npm; nothing to publish"
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                  fi

            # prepublishOnly runs test, typecheck, lint and build first. A
            # pre-release goes to the `next` dist-tag, so a plain install
            # does not pick it up.
            - name: Publish
              if: steps.version.outputs.skip != 'true'
              env:
                  PRERELEASE: ${{ github.event.release.prerelease }}
              run: |
                  if [ "$PRERELEASE" = "true" ]; then
                      npm publish --tag next
                  else
                      npm publish
                  fi
